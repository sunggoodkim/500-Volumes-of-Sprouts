<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리 아이 그림책 도장판</title>
<!--
  [도서관 담당자용 안내]
  1) 이 파일 하나만 올리면 돼요. 서버·가입·외부 서비스가 필요 없어요.
  2) 아래 CFG 에서 제목, 도서관 이름, 안내 문구를 바꿀 수 있어요.
  3) 책 목록은 BOOKS 배열이에요. 책을 추가할 때는 반드시 "맨 뒤"에만 넣어 주세요.
     순서가 바뀌거나 중간에서 책을 빼면 이용자의 기존 기록이 어긋나요.
  4) 형식: [제목, 저자, 출판사, 출판연도, [연령...], 누리과정 영역, 추천기관/수상작, 관련 키워드]
     영역은 "신체운동·건강" "의사소통" "사회관계" "예술경험" "자연탐구" 중 하나(없으면 "").
     영역이 하나라도 입력되면 영역 필터가 자동으로 나타나요.
-->
<style>
:root{--bg:#fff8ee;--card:#fff;--ink:#3b2f2a;--sub:#7d6d63;--line:#f0e2d0;--accent:#e5702e;--ok:#2f9a5f;--chip:#fbefdc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#1d1a17;--card:#2a2622;--ink:#f3e9df;--sub:#b8a99c;--line:#3a342e;--accent:#ff9d66;--ok:#5fcf93;--chip:#35302a}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;line-height:1.5;-webkit-text-size-adjust:100%}
main{max-width:720px;margin:0 auto;padding:20px 16px 56px}
h1{font-size:1.5rem;margin:6px 0 4px}
.lib{font-size:.85rem;color:var(--accent);font-weight:700;margin:0}
.sub{color:var(--sub);font-size:.92rem;margin:0 0 14px}
.notice{background:var(--chip);border-radius:12px;padding:10px 14px;font-size:.88rem;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.big{font-size:1.15rem;font-weight:700}
.bar{height:12px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
.msg{margin-top:8px;font-size:.9rem;color:var(--sub)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tabs button,.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:7px 14px;font:inherit;font-size:.9rem;cursor:pointer;min-height:40px}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tabs.area button.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
input[type=search],textarea,input.code{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 12px;font:inherit;font-size:.95rem;width:100%}
.row label{display:flex;align-items:center;gap:6px;font-size:.9rem;color:var(--sub);cursor:pointer}
.row .count{margin-left:auto;font-size:.88rem;color:var(--sub)}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
li button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;cursor:pointer}
li button:focus-visible,.btn:focus-visible,.tabs button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.cv{flex:none;width:48px;height:60px;border-radius:8px;display:grid;place-items:center;font-size:1.4rem;font-weight:800;color:#3b2f2a}
.tx{flex:1;min-width:0}
.t{font-weight:700;overflow-wrap:anywhere}
.a{font-size:.84rem;color:var(--sub);overflow-wrap:anywhere}
.tag{display:inline-block;font-size:.72rem;background:var(--chip);border-radius:99px;padding:0 8px;margin:2px 4px 0 0}
.st{flex:none;width:46px;height:46px;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;color:var(--sub);font-size:.72rem;text-align:center;line-height:1.1}
li.done button{border-color:var(--ok)}
li.done .st{border:2px solid var(--ok);color:var(--ok);font-weight:800;transform:rotate(-12deg)}
li.done .t{text-decoration:line-through;text-decoration-color:var(--sub)}
.empty{text-align:center;color:var(--sub);padding:28px 0}
details{margin-top:18px}
summary{cursor:pointer;font-weight:700;padding:8px 0}
.help{font-size:.86rem;color:var(--sub);margin:6px 0}
.privacy{margin-top:22px;font-size:.82rem;color:var(--sub);text-align:center}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%}
#toast.show{opacity:1}
</style>
</head>
<body>
<main>
  <p class="lib" id="lib" hidden></p>
  <h1 id="ttl">📚 새싹의 500권</h1>
  <p class="sub" id="sub"></p>
  <div class="notice" id="notice" hidden></div>
  <section class="card" aria-live="polite">
    <div class="big" id="cnt"></div>
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="pbar"><i id="bar"></i></div>
    <div class="msg" id="msg"></div>
  </section>
  <div class="tabs" id="ages" role="group" aria-label="연령"></div>
  <div class="tabs area" id="areas" role="group" aria-label="누리과정 영역" hidden></div>
  <input type="search" id="q" placeholder="제목이나 저자로 찾기" aria-label="검색">
  <div class="row"><label><input type="checkbox" id="hide"> 읽은 책 숨기기</label><span class="count" id="shown"></span></div>
    <details>
    <summary>💾 내 기록 백업하기 / 불러오기</summary>
    <p class="help">기록은 이 기기의 브라우저에만 저장돼요. 브라우저 기록을 지우거나 다른 기기로 바꾸면 사라지니, 아래 코드를 문자나 메모에 저장해 두세요.</p>
    <div class="row"><button class="btn" id="mk">내 기록 코드 만들기</button><button class="btn" id="cp">복사</button></div>
    <input class="code" id="code" readonly placeholder="여기에 코드가 나와요">
    <p class="help">다른 기기에서는 저장해 둔 코드를 붙여 넣고 불러오세요. 지금 기록에 합쳐져요.</p>
    <textarea id="imp" rows="2" placeholder="코드를 여기에 붙여 넣기"></textarea>
    <div class="row"><button class="btn" id="ld">불러오기</button><button class="btn" id="rs">모두 지우기</button></div>
  </details>
  <ul id="list"></ul>

  <p class="privacy">🔒 이 페이지는 이름이나 연락처를 묻지 않아요. 읽은 기록은 서버로 전송되지 않아요.</p>
</main>
<div id="toast" role="status"></div>

const KEY="picturebook-stamps-v1";
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const COLORS={4:"#cfe3ff",5:"#d3efc9",6:"#ffdfbd",7:"#ffd3e1"};
let read={},age=0,area="",storageOK=true;
try{const r=JSON.parse(localStorage.getItem(KEY)||"{}");if(r&&typeof r==="object")read=r}catch(e){storageOK=false}
function save(){try{localStorage.setItem(KEY,JSON.stringify(read))}catch(e){storageOK=false}}
function toast(t){const el=$("toast");el.textContent=t;el.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("show"),2200)}
const isRead=i=>read[i]!==undefined;
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
function msgFor(p){return p===0?"첫 책을 골라볼까요?":p<50?"좋은 출발이에요! 🌱":p<100?"절반 넘게 읽었어요! 🎉":"전부 읽었어요! 최고예요 🏆"}
const hasArea=BOOKS.some(b=>b[5]);
function setup(){
  document.title=CFG.title;$("ttl").textContent="📚 "+CFG.title;$("sub").textContent=CFG.sub;
  if(CFG.library){$("lib").textContent=CFG.library;$("lib").hidden=false}
  if(CFG.notice){$("notice").textContent=CFG.notice;$("notice").hidden=false}
  if(!storageOK)toast("이 브라우저에서는 기록이 저장되지 않을 수 있어요");
  if(hasArea){$("areas").hidden=false}
}
function render(){
  const total=BOOKS.length,n=BOOKS.filter((b,i)=>isRead(i)).length,p=Math.round(n/total*100);
  $("cnt").textContent=n+" / "+total+"권 읽었어요";$("bar").style.width=p+"%";$("pbar").setAttribute("aria-valuenow",p);$("msg").textContent=msgFor(p);
  const cntAge=a=>BOOKS.filter(b=>!a||b[4].includes(a+"세")).length;
  $("ages").innerHTML=[0,4,5,6,7].map(a=>`<button class="${a===age?"on":""}" data-a="${a}">${a?a+"세":"전체"} ${cntAge(a)}</button>`).join("");
  if(hasArea)$("areas").innerHTML=["",...AREAS].map(a=>`<button class="${a===area?"on":""}" data-z="${esc(a)}">${a||"모든 영역"}</button>`).join("");
  const q=$("q").value.trim().toLowerCase(),hide=$("hide").checked;
  const rows=[];
  BOOKS.forEach((b,i)=>{
    if(age&&!b[4].includes(age+"세"))return;
    if(area&&b[5]!==area)return;
    if(hide&&isRead(i))return;
    const searchText = [
    b[0], b[1], b[2], b[6],
    ...(Array.isArray(b[7]) ? b[7] : [])
    ].join(" ").toLowerCase();

  if(q && !searchText.includes(q)) return;
    rows.push(i);
  });
  $("shown").textContent=rows.length+"권 표시 중";
  $("list").innerHTML=rows.length?rows.map(i=>{
    const b=BOOKS[i],d=isRead(i),first=b[4][0]?parseInt(b[4][0]):5;
    const meta=[b[2],b[3]].filter(Boolean).join(" · ");
    return `<li class="${d?"done":""}"><button type="button" data-i="${i}" aria-pressed="${d}"><span class="cv" style="background:${COLORS[first]||"#eee"}">${esc(b[0].replace(/^[^0-9A-Za-z가-힣]+/,"").charAt(0))}</span><span class="tx"><span class="t">${esc(b[0])}</span><br><span class="a">${esc(b[1])}${meta?" · "+esc(meta):""}</span><br>${b[4].map(a=>`<span class="tag">${esc(a)}</span>`).join("")}${b[5]?`<span class="tag">${esc(b[5])}</span>`:""}${d&&read[i]&&read[i]!=="1"?`<span class="tag">${esc(read[i])} 읽음</span>`:""}</span><span class="st">${d?"읽음":"누르기"}</span></button></li>`;
  }).join(""):`<li class="empty">표시할 책이 없어요 📭</li>`;
}
$("ages").onclick=e=>{const b=e.target.closest("button");if(b){age=+b.dataset.a;render()}};
$("areas").onclick=e=>{const b=e.target.closest("button");if(b){area=b.dataset.z;render()}};
$("list").onclick=e=>{const b=e.target.closest("button[data-i]");if(!b)return;const i=+b.dataset.i;if(isRead(i))delete read[i];else read[i]=today();save();render()};
$("q").oninput=render;$("hide").onchange=render;
function makeCode(){
  const N=BOOKS.length,bytes=new Uint8Array(Math.ceil(N/8));
  for(let i=0;i<N;i++)if(isRead(i))bytes[i>>3]|=1<<(i&7);
  let s="";bytes.forEach(v=>s+=String.fromCharCode(v));
  return "S1."+N+"."+btoa(s).replace(/=+$/,"");
}
function applyCode(txt){
  const m=/^S1\.(\d+)\.([A-Za-z0-9+/]*)$/.exec(txt.trim());
  if(!m)return -1;
  let raw;try{raw=atob(m[2])}catch(e){return -1}
  const N=Math.min(+m[1],BOOKS.length);let added=0;
  for(let i=0;i<N;i++){const byte=raw.charCodeAt(i>>3)||0;if((byte>>(i&7))&1&&!isRead(i)){read[i]="1";added++}}
  save();return added;
}
$("mk").onclick=()=>{$("code").value=makeCode();$("code").select()};
$("cp").onclick=async()=>{
  if(!$("code").value)$("code").value=makeCode();
  try{await navigator.clipboard.writeText($("code").value);toast("복사했어요")}
  catch(e){$("code").select();try{document.execCommand("copy");toast("복사했어요")}catch(_){toast("코드를 길게 눌러 복사해 주세요")}}
};
$("ld").onclick=()=>{const r=applyCode($("imp").value);if(r<0)toast("코드를 다시 확인해 주세요");else{toast(r+"권을 불러왔어요");$("imp").value="";render()}};
$("rs").onclick=()=>{if(confirm("읽은 기록을 모두 지울까요? 되돌릴 수 없어요.")){read={};save();render();toast("기록을 지웠어요")}};
setup();render();
</script>
